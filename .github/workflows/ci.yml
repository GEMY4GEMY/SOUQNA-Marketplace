name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/souqna
          AUTH_SECRET: ci-only-secret-not-used-in-production
