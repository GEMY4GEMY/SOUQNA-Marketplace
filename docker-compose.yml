services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: souqna
      POSTGRES_USER: souqna
      POSTGRES_PASSWORD: souqna_dev
    ports:
      - "5432:5432"
    volumes:
      - souqna_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U souqna -d souqna"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  souqna_postgres:
